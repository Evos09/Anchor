# Anchor's model registry (Update #1 §6, ADR-0030). Data, not code: the
# app and the free-tier proxy load it, validate it, and refuse to start if
# it is wrong. Selection reads the license fields, never a model's name.
#
# A model may be on the free tier (path A) only if its license permits
# commercial use with no revenue or user-count gate. No provider has
# cleared the terms gate (Update #1 §5.7, docs/adr/providers/), so no
# model is offered on path A today.
#
# Licenses below were recorded on 2026-10-08 from the Ollama library and
# the model cards as quoted in search results; Anchor could not open the
# pages directly from its build environment. Before relying on one,
# confirm it with `ollama show <tag> --license`. "verified_by" says how
# each entry was checked.
#
# Path B providers list no models: after you add a key, Anchor reads the
# provider's own model list and you pick from it. `family` is the family
# of that provider's models, for the reviewer-is-another-family rule.

# ---------------------------------------------------------------- providers

[[provider]]
id = "ollama"
display_name = "Ollama (on this computer)"
base_url = "http://127.0.0.1:11434/v1"
paths = ["C"]
key_url = ""
terms_url = "https://ollama.com"

[[provider]]
id = "openai"
display_name = "OpenAI"
base_url = "https://api.openai.com/v1"
paths = ["B"]
family = "openai"
key_url = "https://platform.openai.com/api-keys"
terms_url = "https://openai.com/policies/services-agreement"

[[provider]]
id = "mistral"
display_name = "Mistral AI"
base_url = "https://api.mistral.ai/v1"
paths = ["B"]
family = "mistral"
key_url = "https://console.mistral.ai/api-keys"
terms_url = "https://mistral.ai/terms"

[[provider]]
id = "deepseek"
display_name = "DeepSeek"
base_url = "https://api.deepseek.com/v1"
paths = ["B"]
family = "deepseek"
key_url = "https://platform.deepseek.com/api_keys"
terms_url = "https://platform.deepseek.com/downloads/DeepSeek%20Open%20Platform%20Terms%20of%20Service.html"

[[provider]]
id = "gemini"
display_name = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
paths = ["B"]
family = "gemini"
key_url = "https://aistudio.google.com/apikey"
terms_url = "https://ai.google.dev/gemini-api/terms"

