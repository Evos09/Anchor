[workspace]
resolver = "3"
members = [
    "crates/anchor-protocol",
    "crates/anchor-fs",
    "crates/anchor-policy",
    "crates/anchor-guard",
    "crates/anchor-checkpoint",
    "crates/anchor-exec",
    "crates/anchor-seccomp",
    "crates/anchor-snapshot",
    "crates/anchor-hub",
    "crates/anchor-verify",
    "crates/anchor-runtime",
    "crates/anchor-backend",
    "crates/anchor-sandbox-validation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/evos09/anchor"
rust-version = "1.89"

[workspace.dependencies]
# Every entry here has a five-step record in docs/deps/ (spec §0).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
toml = "1.1.6"
thiserror = "2.0.21"
sha2 = "0.11.0"
regex = "1.13.1"
globset = "0.4.20"
ignore = "0.4.33"
rustix = { version = "1.1.5", features = ["fs", "process", "std"] }
libc = "0.2.190"
ureq = "3.4.2"
landlock = "0.4.7"
unicode-normalization = "0.1.25"
windows-sys = "0.61.2"
tempfile = "3.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
getrandom = "0.4.3"

anchor-protocol = { path = "crates/anchor-protocol", version = "0.1.0" }
anchor-fs = { path = "crates/anchor-fs", version = "0.1.0" }
anchor-policy = { path = "crates/anchor-policy", version = "0.1.0" }
anchor-guard = { path = "crates/anchor-guard", version = "0.1.0" }
anchor-checkpoint = { path = "crates/anchor-checkpoint", version = "0.1.0" }
anchor-exec = { path = "crates/anchor-exec", version = "0.1.0" }
anchor-seccomp = { path = "crates/anchor-seccomp", version = "0.1.0" }
anchor-snapshot = { path = "crates/anchor-snapshot", version = "0.1.0" }
anchor-hub = { path = "crates/anchor-hub", version = "0.1.0" }
anchor-verify = { path = "crates/anchor-verify", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
debug = 1
