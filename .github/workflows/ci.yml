name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (includes the Layer 2 no-filesystem rule)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast
      - name: Type-check other platforms
        run: |
          rustup target add x86_64-pc-windows-gnu aarch64-apple-darwin
          # Crates with platform-specific code. anchor-runtime is excluded:
          # its TLS dependency (ring) needs a C cross-compiler; it has no
          # platform-specific code of its own beyond the cfg-gated sandbox.
          for t in x86_64-pc-windows-gnu aarch64-apple-darwin; do
            cargo check --tests --target "$t" -p anchor-fs -p anchor-exec -p anchor-backend -p anchor-policy -p anchor-guard -p anchor-checkpoint -p anchor-protocol -p anchor-snapshot
          done

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Advisories, licenses, bans, sources
        run: cargo deny check

  other-platforms:
    # Blocking since CI run 37448154072, the first in which the macOS and
    # Windows back ends passed the suite (docs/threat-model.md).
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  snapshot-bench:
    # Spec §14 Phase 3: "a 100k-file monorepo snapshots incrementally in
    # < 2 s, measured and published". The gate is on Linux; macOS and
    # Windows runner I/O varies too much for a hard bound, so their numbers
    # are reported only (docs/benchmarks/snapshot.md).
    name: snapshot benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gate: "--max-incremental-ms 2000"
          - os: macos-latest
            gate: ""
          - os: windows-latest
            gate: ""
    runs-on: ${{ matrix.os }}
    # Windows takes about 40 minutes (Defender scans every file written).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release -p anchor-snapshot --example bench
      - name: 100k-file benchmark
        shell: bash
        run: cargo run --release -p anchor-snapshot --example bench -- --files 100000 --runs 5 --summary "$GITHUB_STEP_SUMMARY" ${{ matrix.gate }}
