name: CI

on:
  push:
  pull_request:
  # Manual runs also run the macOS and Windows benchmarks (below).
  workflow_dispatch:

# A newer push to the same ref cancels the run it supersedes, so a burst of
# pushes does not stack up runner minutes. Keyed by event too, so a push
# never cancels a manually started benchmark run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dashboard frontend (ADR-0025; embedded by the Rust build)
        working-directory: ui
        run: |
          # No lifecycle script of any package runs (dependency-records.md).
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (includes the Layer 2 no-filesystem rule)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast
      - name: Sandbox validation report (spec §14 Phase 7)
        if: always()
        run: cat target/sandbox-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Sandbox tests, seccomp-only tier (no user namespaces)
        run: ANCHOR_EXEC_TEST_DISABLE_USERNS=1 cargo test -p anchor-exec -p anchor-sandbox-validation -p anchor-seccomp --no-fail-fast
      - name: Seeded-bug harness (spec §8.5)
        run: |
          # The rule baseline on the whole corpus, reported in the job
          # summary; the oracle must let no bug through (harness self-check).
          cargo run -q -p anchor-backend --bin anchor -- eval run \
            --corpus examples/eval/corpus --reviewer rule --md "$GITHUB_STEP_SUMMARY"
          cargo run -q -p anchor-backend --bin anchor -- eval run \
            --corpus examples/eval/corpus --reviewer oracle --max-fn-rate 0
      - name: Verifier plugin conformance (spec §14 Phase 8)
        # `shell: bash` runs with pipefail, so a failing check fails the step.
        shell: bash
        run: |
          python3 -m unittest examples/verifier-python/test_verifier.py
          {
            echo '### Verifier plugin conformance'; echo '```'
            cargo run -q -p anchor-backend --bin anchor -- \
              verifier check examples/verifier-python/verifier.toml
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dashboard end to end (spec §14 Phase 6, Chromium)
        working-directory: ui
        run: |
          cargo build --workspace --bins
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screens
          path: ui/test-results/
          if-no-files-found: ignore
      - name: Type-check other platforms
        run: |
          rustup target add x86_64-pc-windows-gnu aarch64-apple-darwin
          # Crates with platform-specific code. Excluded because they need a
          # C cross-compiler: anchor-runtime (its TLS dependency, ring) and
          # anchor-hub / anchor-backend (bundled SQLite). Those are built and
          # tested natively on macOS and Windows by the jobs below.
          for t in x86_64-pc-windows-gnu aarch64-apple-darwin; do
            cargo check --tests --target "$t" -p anchor-fs -p anchor-exec -p anchor-policy -p anchor-guard -p anchor-checkpoint -p anchor-protocol -p anchor-snapshot -p anchor-sandbox-validation
          done

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Advisories, licenses, bans, sources
        run: cargo deny check

  other-platforms:
    # Blocking since CI run 37448154072, the first in which the macOS and
    # Windows back ends passed the suite (docs/threat-model.md).
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast
      - name: Sandbox validation report (spec §14 Phase 7)
        if: always()
        shell: bash
        run: cat target/sandbox-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Verifier plugin conformance (spec §14 Phase 8)
        shell: bash
        run: |
          PY=$(command -v python3 >/dev/null && python3 --version >/dev/null 2>&1 && echo python3 || echo python)
          "$PY" -m unittest examples/verifier-python/test_verifier.py
          cargo run -q -p anchor-backend --bin anchor -- \
            verifier check examples/verifier-python/verifier.toml

  quickstart:
    # Spec §14 Phase 8: "the CI is green on a fresh clone". Clones the
    # checkout into a new directory (no build cache, no prior state) and
    # runs the contributor quickstart exactly as CONTRIBUTING.md gives it.
    name: Contributor quickstart (fresh clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: checkout
      - name: Fresh clone
        run: git clone --no-local checkout "$RUNNER_TEMP/anchor"
      - name: Toolchain (as rust-toolchain.toml pins it)
        working-directory: ${{ runner.temp }}/anchor
        run: rustup toolchain install
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: scripts/quickstart.sh
        working-directory: ${{ runner.temp }}/anchor
        run: ./scripts/quickstart.sh

  snapshot-bench:
    # Spec §14 Phase 3: "a 100k-file monorepo snapshots incrementally in
    # < 2 s, measured and published". The gate is on Linux and runs on
    # every push (docs/benchmarks/snapshot.md).
    name: snapshot benchmark (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release -p anchor-snapshot --example bench
      - name: 100k-file benchmark
        run: cargo run --release -p anchor-snapshot --example bench -- --files 100000 --runs 5 --summary "$GITHUB_STEP_SUMMARY" --max-incremental-ms 2000

  snapshot-bench-other:
    # macOS and Windows runner I/O varies too much for a hard bound, so their
    # numbers are reported only. They are also the costliest jobs (macOS
    # minutes bill at 10x, Windows at 2x, and Windows takes about 40 minutes
    # because Defender scans every file written), so they run only when the
    # workflow is started by hand (Actions > CI > Run workflow).
    if: github.event_name == 'workflow_dispatch'
    name: snapshot benchmark (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release -p anchor-snapshot --example bench
      - name: 100k-file benchmark
        shell: bash
        run: cargo run --release -p anchor-snapshot --example bench -- --files 100000 --runs 5 --summary "$GITHUB_STEP_SUMMARY"
